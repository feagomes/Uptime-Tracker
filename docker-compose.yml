version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracker_postgres
    restart: always
    environment:
      POSTGRES_DB: app_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fealgo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
